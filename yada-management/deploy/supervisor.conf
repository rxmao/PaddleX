[program:yada-backend]
directory=/var/www/yada-management/backend
command=/var/www/yada-management/backend/venv/bin/gunicorn -w 4 -b 127.0.0.1:5000 --timeout 120 run:app
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/yada-backend.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
environment=FLASK_ENV="production"
